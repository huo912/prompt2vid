# kagent 凭据 Secret
# 注意：kagent Harness 不支持 envFrom/Secret 引用（env 只接受字面量），
# 此 Secret 供部署流程参考；实际注入方式见 harness.yaml 注释。
apiVersion: v1
kind: Secret
metadata:
  name: prompt2vid-secrets
  namespace: kagent
type: Opaque
stringData:
  # LLM 网关（OpenAI 兼容）
  PROMPT2VID_LLM_API_KEY: "sk-REPLACE_ME"
  PROMPT2VID_LLM_BASE_URL: "https://your-llm-gateway.example.com/v1"
  # 抖音开放平台凭据（申请见 README）
  DOUYIN_CLIENT_KEY: "REPLACE_ME"
  DOUYIN_CLIENT_SECRET: "REPLACE_ME"
  DOUYIN_ACCESS_TOKEN: "REPLACE_ME"
  # 开发期保持 dry-run
  DOUYIN_DRY_RUN: "true"
