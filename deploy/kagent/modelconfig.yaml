# kagent ModelConfig：LLM 网关（OpenAI 兼容）
# api.kagent.dev/v1alpha3
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: prompt2vid-model-config
  namespace: kagent
spec:
  model: gpt-4o-mini
  provider: OpenAI
  openAI:
    # OpenAI 兼容网关地址（替换为你的网关）
    baseUrl: "https://your-llm-gateway.example.com/v1"
    apiFormat: chatCompletions
  # apiKeySecret 与 apiKeySecretKey 成对出现；
  # 部署前创建：
  #   kubectl -n kagent create secret generic llm-api-key \
  #     --from-literal=api-key='sk-REPLACE_ME'
  apiKeySecret: llm-api-key
  apiKeySecretKey: api-key
