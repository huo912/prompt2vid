write_script:
  description: >-
    根据需求文档（requirement.json）撰写短视频剧本。
    输入：requirement.json 的内容（如未看到，用 read_json 文件工具读取）。
    输出：将剧本写入 script.md（使用 write_text 文件工具，相对路径即可，
    工具会自动落到工作目录），并在最终回答中给出剧本全文。
    剧本结构：
    # 标题
    ## 整体叙事
    一段话概述叙事结构（钩子-展开-收尾）。
    ## 逐镜文案
    ### 镜头 1
    - 旁白：本镜旁白文案（口语化、短句）
    - 画面：本镜画面描述（中文，具体可视化）
    ### 镜头 2
    ...
    要求：
    0. 必须真实调用 write_text 把剧本写进 script.md——只把剧本贴在最终回答里
       而不调用工具，本步骤会被判定失败；
    1. 前 3 秒（第一镜）必须有强钩子；
    2. 每镜旁白字数 = 镜头秒数 × 4.5（中文语速），镜头数 = duration_seconds / 4（每镜约 4 秒）；
    3. 画面描述必须具体、可视化，避免抽象概念（AI 生成需要）；
    4. 总镜头时长之和必须等于 duration_seconds。
  expected_output: >-
    一份 Markdown 剧本（已写入 script.md），含整体叙事与逐镜旁白/画面描述，
    镜头时长之和等于需求的目标总时长。
  agent: script_writer
