write_script:
  description: >-
    根据需求文档（requirement.json）撰写短视频剧本。
    输入：requirement.json 的内容（如未看到，用 read_json 文件工具读取）。
    输出：将剧本写入 script.md（使用 write_text 文件工具，相对路径即可，
    工具会自动落到工作目录），并在最终回答中给出剧本全文。
    剧本结构：
    # 标题
    ## 整体叙事
    一段话概述叙事结构（钩子-展开-收尾）。
    ## 角色
    - 角色名：一句话人设（年龄/身份/性格）；口吻：方言 + 参照人物 + 口头禅 +
      语速节奏（如「东北农村老大爷，赵本山式慢条斯理、拉长音、蔫儿坏，爱反问」）
      ——没有人物出镜就写「无」
    ## 逐镜文案
    ### 镜头 1
    - 台词：角色名：该角色本镜说出的台词（口语化、短句）
    - 台词：旁白：本镜旁白（可选，用于无人说话的过渡/收尾）
    - 画面：本镜画面描述（中文，具体可视化）
    ### 镜头 2
    ...
    要求：
    0. 必须真实调用 write_text 把剧本写进 script.md——只把剧本贴在最终回答里
       而不调用工具，本步骤会被判定失败；
    1. 前 3 秒（第一镜）必须有强钩子；
    1a. 台词必须是「说出来的话」，不是「写出来的文字」：用短句、口语、
       语气词、口头禅、反问、抢话、半截话；允许方言和不规范语法
       （咋、啥、整、得瑟、你瞅啥、哎呀妈呀、可不是咋的、我跟你讲…），
       禁止新闻稿腔、书面语、成语堆砌、排比句——这就是「配音像读课文」
       的源头；
    1b. 人物要说人话：有人物出镜的镜头必须写「- 台词：角色名：…」，
       不要把人物台词改写成旁白。只有纯空镜/转场镜才用「- 台词：旁白：…」；
       一个镜头 1-3 句台词，一句 6-18 字（镜头 3-5 秒，中文语速约 5 字/秒）；
    1c. 需求里指定了口吻（如「玉帝用赵本山口吻、哮天犬用赵四口吻」）时，
       角色表必须逐个写清该角色对应哪位参照人物的语感，台词必须按那个
       语感写——口吻差别要落在用词、句式、语气词和语速上，不能只换个名字；
    1d. 需求要求搞笑/讽刺/夸张时：让角色互相拆台、抢功、甩锅、装蒜、
       一本正经地胡说八道；用反差和急转弯制造笑点，讽刺要落在具体行为
       和台词上（不要直接说「这很讽刺」），夸张到明显失真仍然自洽；
    1e. 每句台词心里都要有「怎么说」——是阴阳怪气、倒吸凉气、拔高嗓门，
       还是慢条斯理地损人；写完自己念一遍，念着别扭就重写；
    2. 每镜台字数 = 镜头秒数 × 4.5（中文语速），镜头数 = duration_seconds / 4（每镜约 4 秒）；
    3. 画面描述必须具体、可视化，避免抽象概念（AI 生成需要）；
    4. 总镜头时长之和必须等于 duration_seconds。
  expected_output: >-
    一份 Markdown 剧本（已写入 script.md），含整体叙事、角色表（有则写，
    每个角色带人设与口吻）与逐镜台词/画面描述，台词必须是口语化的人话，
    镜头时长之和等于需求的目标总时长。
  agent: script_writer
