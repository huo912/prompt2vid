generate_images:
  description: >-
    为分镜表（storyboard.json）中每个分镜生成首帧图。
    直接调用 generate_frames 工具（无需任何参数）：该工具会自动读取
    工作目录的 storyboard.json，逐镜调用 ComfyUI 文生图（prompt 取每镜
    的 image_prompt，输出 frames/shot_<id>.png），失败自动重试，
    并把真实结果清单写入 frames/manifest.json。
    调用完成后，把工具返回的 JSON 汇总（含 succeeded/failed/manifest）
    原样作为你的最终回答，可附一句简短结论（如失败分镜及原因）。
    不要自己逐镜调用工具，不要手工编写 manifest。
  expected_output: >-
    generate_frames 工具返回的 JSON 汇总：stage、total、succeeded、
    failed、manifest（frames/manifest.json）及失败分镜明细。
  agent: image_generator
