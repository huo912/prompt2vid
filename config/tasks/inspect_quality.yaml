inspect_quality:
  description: >-
    对最终成片与全流程产物做质量检查。
    使用文件与探测工具，逐项核验：
    1. final/final.mp4 存在且可读；
    2. 成片时长与需求 duration_seconds 误差在 ±2 秒内；
    3. 成片分辨率与帧率正常（宽 ≥ 512）；
    4. 成片包含音轨；
    5. 分镜产物齐全：frames/manifest.json、clips/manifest.json、
       audio/manifest.json 中每个分镜的文件都真实存在。
    将质检报告写入 report/quality_report.json：
    {
      "passed": true/false,
      "checks": [{"name": "final_video_exists", "passed": true, "detail": "..."}, ...],
      "summary": "一句话结论"
    }
    并在最终回答中给出报告 JSON。
    要求：所有检查必须基于工具探测的真实结果，绝不臆测。
  expected_output: >-
    report/quality_report.json 质检报告，含 passed 布尔结论、逐项检查明细
    （final_video_exists、duration_match、resolution_ok、audio_track_present、
    assets_complete）与 summary。
  agent: quality_inspector
