analyze_requirement:
  description: >-
    解析用户的一句话视频描述，产出结构化需求文档。
    用户原始描述：{user_prompt}
    输出：将以下 JSON 写入工作目录的 requirement.json 文件（使用 write_json
    文件工具，相对路径即可，工具会自动落到工作目录），
    并在最终回答中给出同样的 JSON 内容：
    {
      "topic": "主题",
      "style": "画面风格（如治愈系、电影感、国风等）",
      "audience": "目标受众",
      "duration_seconds": 目标总时长（短视频建议 15-30 秒）,
      "aspect_ratio": "9:16 或 16:9（抖音建议 9:16）",
      "key_elements": ["关键画面元素1", "关键画面元素2"],
      "tone": "情绪基调",
      "acceptance_criteria": ["验收标准1", "验收标准2"]
    }
    要求：duration_seconds 必须在 15-30 之间；key_elements 至少 3 个；
    所有字段必须基于用户描述推导，不得虚构与描述无关的内容；
    必须真实调用 write_json 工具把 JSON 写入 requirement.json。
  expected_output: >-
    一个 JSON 对象（已通过文件工具写入 requirement.json），包含 topic、
    style、audience、duration_seconds、aspect_ratio、key_elements、tone、
    acceptance_criteria 字段。
  agent: requirement_analyst
