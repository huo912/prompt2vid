generate_videos:
  description: >-
    将每个分镜的首帧图转化为视频片段。
    直接调用 generate_clips 工具（无需任何参数）：该工具会自动读取
    工作目录的 frames/manifest.json 与 storyboard.json，逐镜调用
    ComfyUI LTX-Video 图生视频（正向提示词 = image_prompt + motion_prompt，
    帧数按时长自动换算并满足 8n+1 约束，输出 clips/shot_<id>.webm），
    失败自动重试，并把真实结果清单写入 clips/manifest.json。
    调用完成后，把工具返回的 JSON 汇总原样作为你的最终回答，
    可附一句简短结论（如失败分镜及原因）。
    不要自己逐镜调用工具，不要手工编写 manifest。
  expected_output: >-
    generate_clips 工具返回的 JSON 汇总：stage、total、succeeded、
    failed、manifest（clips/manifest.json）及失败分镜明细。
  agent: video_generator
