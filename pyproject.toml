[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt2vid"
version = "0.1.0"
description = "Multi-agent text-to-video pipeline: CrewAI + ComfyUI (LTX-Video) + edge-tts + ffmpeg, auto-publish to Douyin"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "crewai==1.15.27",
    "crewai-tools==1.15.27",
    "a2a-sdk[fastapi]==1.2.2",
    "uvicorn>=0.30",
    "edge-tts==7.2.8",
    "httpx>=0.27,<1",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
prompt2vid = "prompt2vid.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt2vid = ["agent-card.json"]
