[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt2vid"
version = "0.1.0"
description = "Multi-agent text-to-video pipeline: CrewAI + ComfyUI (LTX-Video) + edge-tts + ffmpeg, auto-publish to Douyin"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "crewai==1.15.27",
    "crewai-tools==1.15.27",
    "a2a-sdk[fastapi]==1.2.2",
    "uvicorn>=0.30",
    "edge-tts==7.2.8",
    "httpx>=0.27,<1",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# 本地无 ffmpeg 时可用随包静态二进制（imageio-ffmpeg 只带 ffmpeg，
# 探测会自动回退解析 ffmpeg 输出；static-ffmpeg 另带 ffprobe）
local-media = ["imageio-ffmpeg>=0.5"]
# 离线神经网络配音（edge-tts 被网络拦截时的本地回退，音色放 models/tts/）
tts = ["piper-tts>=1.8"]

[project.scripts]
prompt2vid = "prompt2vid.main:main"
prompt2vid-server = "prompt2vid.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt2vid = ["agent-card.json", "web/*"]
